<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Crypto- & KI-News-Scanner · Öffentlicher Showcase</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #21262d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --orange: #d29922; --yellow: #e3b341;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 80px; }
  header { position: sticky; top: 0; background: rgba(13,17,23,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; z-index: 10; }
  header .brand { flex: 1; min-width: 0; }
  header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  header .subtitle { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  header .last { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .interval-badge { font-size: 10.5px; font-weight: 600; color: #79c0ff; background: #1f6feb22; border: 1px solid #1f6feb44; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-left: 2px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .tabs { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.active { background: var(--accent); color: #04101f; border-color: var(--accent); }
  .filters { display: flex; gap: 8px; padding: 10px 16px; flex-wrap: wrap; }
  .filters select, .filters input { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .filters select#catFilter { width: 230px; max-width: 100%; text-overflow: ellipsis; }
  main { padding: 12px 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .b9 { background: #f8514933; color: var(--red); }
  .b8 { background: #d2992233; color: var(--orange); }
  .b7 { background: #e3b34133; color: var(--yellow); }
  .b6 { background: #3fb95033; color: var(--green); }
  .cat { font-size: 12px; color: var(--muted); }
  .title { font-size: 15px; font-weight: 600; margin: 6px 0 4px; line-height: 1.35; }
  .title a { color: var(--text); text-decoration: none; }
  .summary { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .read-more { margin-top: 8px; }
  .read-more a { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 5px 12px; border: 1px solid #1f6feb55; border-radius: 8px; background: #1f6feb18; }
  .read-more a:hover { background: #1f6feb33; }
  .meta { font-size: 11.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { background: #1f6feb22; color: #79c0ff; border-radius: 6px; padding: 1px 7px; font-size: 11px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  /* Link tiles */
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 16px 0 8px; }
  .links-note { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .link-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .link-card .lname { font-size: 14.5px; font-weight: 700; }
  .link-card .ldesc { font-size: 12.5px; color: var(--muted); line-height: 1.45; flex: 1; }
  .link-card .lgo { align-self: flex-start; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 5px 12px; border: 1px solid #1f6feb55; border-radius: 8px; background: #1f6feb18; }
  .link-card .lgo:hover { background: #1f6feb33; }
  .footer-note { text-align: center; color: var(--muted); font-size: 11px; padding: 20px 16px 0; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>📡 News Scanner <span class="live-dot" title="Automatisch aktualisiert"></span></h1>
    <div class="subtitle">Crypto- &amp; KI-News · öffentlicher, rein lesender Showcase</div>
  </div>
  <div class="header-right">
    <span class="interval-badge">🔒 Nur lesen</span>
    <span class="last" id="lastScan">…</span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="crypto">🪙 Crypto</div>
  <div class="tab" data-tab="ai">🤖 AI</div>
  <div class="tab" data-tab="links">🔗 Links</div>
</div>

<div class="filters" id="filters">
  <select id="catFilter"><option value="">Alle Kategorien</option></select>
  <select id="scoreFilter">
    <option value="">Alle Scores</option><option value="6">≥ 6</option>
    <option value="7">≥ 7</option><option value="8">≥ 8</option><option value="9">≥ 9</option>
  </select>
</div>

<main id="content"></main>
<div class="footer-note">KI-gestützte Bewertung und Zusammenfassungen · Originalquellen verlinkt · Keine Finanzberatung</div>

<script>
const $ = (s) => document.querySelector(s);
let currentTab = "crypto";
let newsCache = null;
let categoryCache = null;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}
function safeUrl(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" || url.protocol === "http:" ? url.href : "#";
  } catch { return "#"; }
}

function badge(score) {
  const b = score >= 9 ? "b9" : score >= 8 ? "b8" : score >= 7 ? "b7" : "b6";
  return `<span class="badge ${b}">${score}/10</span>`;
}
function catEmoji(stream, cat) {
  const m = {
    crypto: { "FUD":"🚨","Tech Update":"⚙️","Regulation":"⚖️","Macro":"🌍","Hack & Security":"🛡️","Other":"📰" },
    ai: { "Model Release & Capability":"🧠","Research & Open Source":"📄","Regulation & Policy":"⚖️","Business & Funding":"💼","Hardware & Infrastructure":"🔌","Safety & Risk":"🛡️","Society & Work":"👥" }
  };
  return (m[stream] && m[stream][cat]) || "📰";
}
function domain(url) { try { return new URL(url).hostname.replace("www.", ""); } catch { return url; } }
function timeAgo(iso) {
  if (!iso) return "";
  const t = new Date(iso.replace("Z", "+00:00")).getTime();
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "gerade eben";
  if (m < 60) return `vor ${m} Min.`;
  const h = Math.round(m / 60);
  if (h < 24) return `vor ${h} Std.`;
  return `vor ${Math.round(h / 24)} Tagen`;
}

async function loadNews() {
  if (!newsCache) newsCache = await (await fetch("./data/news.json", { cache: "no-store" })).json();
  const cat = $("#catFilter").value;
  const min = Number($("#scoreFilter").value || 0);
  const arts = newsCache
    .filter((article) => article.stream === currentTab)
    .filter((article) => !cat || article.category === cat)
    .filter((article) => Number(article.score || 0) >= min)
    .slice(0, 60);
  renderNews(arts);
}

function renderNews(arts) {
  const el = $("#content");
  if (!arts.length) { el.innerHTML = '<div class="empty">Keine Artikel entsprechen diesem Filter.</div>'; return; }
  el.innerHTML = arts.map((a) => {
    const url = safeUrl(a.url);
    return `
    <div class="card">
      <div class="top">${badge(a.score)} <span class="cat">${catEmoji(a.stream, a.category)} ${esc(a.category || "–")}</span>
        <span class="cat" style="margin-left:auto">${esc(a.source || "")}</span></div>
      <div class="title"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="summary">${esc(a.summary)}</div>` : ""}
      <div class="read-more"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">→ Zum Originalartikel</a></div>
      <div class="meta">
        <span>🕐 ${esc(timeAgo(a.published))}</span>
        ${(a.instruments || []).map((i) => `<span class="tag">${esc(i)}</span>`).join("")}
        ${(a.entities || []).map((e) => `<span class="tag">${esc(e)}</span>`).join("")}
      </div>
    </div>`;
  }).join("");
}

async function loadLinks() {
  const el = $("#content");
  let data;
  try {
    data = await (await fetch("./data/links.json", { cache: "no-store" })).json();
  } catch {
    el.innerHTML = '<div class="empty">Link-Liste ist gerade nicht verfügbar.</div>';
    return;
  }
  const links = data.links || [];
  const groups = {};
  for (const l of links) {
    const g = l.group || "–";
    (groups[g] = groups[g] || []).push(l);
  }
  el.innerHTML = '<div class="links-note">Persönliche Trading-Seiten — ein Klick öffnet die Seite direkt in einem neuen Tab.</div>' +
    Object.entries(groups).map(([g, items]) => `
    <div class="section-title">${esc(g)}</div>
    <div class="link-grid">${items.map((l) => `
      <div class="link-card">
        <div class="lname">${l.emoji ? esc(l.emoji) + " " : ""}${esc(l.name)}</div>
        <div class="ldesc">${esc(l.desc || "")}</div>
        <a class="lgo" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">Öffnen ↗</a>
      </div>`).join("")}</div>`).join("");
}

async function loadCategories() {
  if (!categoryCache) categoryCache = await (await fetch("./data/categories.json")).json();
  const sel = $("#catFilter");
  (categoryCache[currentTab] || []).forEach((c) => {
    const option = document.createElement("option");
    option.value = c;
    option.textContent = c;
    sel.appendChild(option);
  });
}

async function refresh() {
  newsCache = null;
  if (currentTab === "links") await loadLinks();
  else await loadNews();
  const stats = await fetch("./data/stats.json", { cache: "no-store" }).then((r) => r.json());
  $("#lastScan").textContent = stats.last_updated
    ? `Aktualisiert: ${new Date(stats.last_updated.replace("Z", "+00:00")).toLocaleString("de-DE")}`
    : "";
}

document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", async () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
    t.classList.add("active");
    currentTab = t.dataset.tab;
    $("#filters").style.display = currentTab === "links" ? "none" : "flex";
    $("#catFilter").innerHTML = '<option value="">Alle Kategorien</option>';
    if (currentTab !== "links") await loadCategories();
    refresh();
  });
});
$("#catFilter").addEventListener("change", refresh);
$("#scoreFilter").addEventListener("change", refresh);

(async function init() {
  try {
    await loadCategories();
    await refresh();
    setInterval(refresh, 300000);
  } catch (error) {
    $("#content").innerHTML = '<div class="empty">Öffentliche Daten sind vorübergehend nicht verfügbar. Bitte versuche es später erneut.</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
