name: Marktbericht
on:
  schedule:
    - cron: "0,30 * * * *" # alle 30 Min (UTC); Slot-Check 09:00/15:30/22:00 Berlin im Skript
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: marktbericht
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      NOUS_REFRESH_TOKEN: ${{ secrets.NOUS_REFRESH_TOKEN }}
      NOUS_CLIENT_ID: ${{ secrets.NOUS_CLIENT_ID }}
      NOUS_PORTAL_BASE_URL: ${{ secrets.NOUS_PORTAL_BASE_URL }}
      NOUS_INFERENCE_BASE_URL: ${{ secrets.NOUS_INFERENCE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Marktbericht erzeugen (nur zu Slot-Zeiten)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAINT_TOKEN: ${{ secrets.GH_MAINT_TOKEN }}
        run: python3 scanner/cloud_report.py --slot
