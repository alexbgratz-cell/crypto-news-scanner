name: Bericht-Trigger (ntfy)
on:
  schedule:
    - cron: "*/2 * * * *" # alle 2 Min den Refresh-Briefkasten pollen
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: marktbericht
  cancel-in-progress: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      NOUS_REFRESH_TOKEN: ${{ secrets.NOUS_REFRESH_TOKEN }}
      NOUS_CLIENT_ID: ${{ secrets.NOUS_CLIENT_ID }}
      NOUS_PORTAL_BASE_URL: ${{ secrets.NOUS_PORTAL_BASE_URL }}
      NOUS_INFERENCE_BASE_URL: ${{ secrets.NOUS_INFERENCE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: ntfy-Signal abfragen → Marktbericht
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAINT_TOKEN: ${{ secrets.GH_MAINT_TOKEN }}
        run: python3 scanner/cloud_report.py --ntfy
