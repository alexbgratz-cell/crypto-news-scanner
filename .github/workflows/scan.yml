name: News-Scanner (Cloud)
on:
  schedule:
    - cron: "*/15 * * * *" # alle 15 Min: Feeds, Analyse, Push, Commit
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      NOUS_REFRESH_TOKEN: ${{ secrets.NOUS_REFRESH_TOKEN }}
      NOUS_CLIENT_ID: ${{ secrets.NOUS_CLIENT_ID }}
      NOUS_PORTAL_BASE_URL: ${{ secrets.NOUS_PORTAL_BASE_URL }}
      NOUS_INFERENCE_BASE_URL: ${{ secrets.NOUS_INFERENCE_BASE_URL }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Scanner ausführen (Fetch + KI-Analyse + Push + Commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAINT_TOKEN: ${{ secrets.GH_MAINT_TOKEN }}
        run: python3 scanner/cloud_scan.py
