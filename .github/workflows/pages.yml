name: Deploy public dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Workflow-Commits (GITHUB_TOKEN) triggern keinen push-Deploy:
  # nach erfolgreichem Marktbericht/ntfy-Lauf direkt neu deployen.
  workflow_run:
    workflows: ["Marktbericht", "Bericht-Trigger (ntfy)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
