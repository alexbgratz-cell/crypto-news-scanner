<head>

<title>SCANNER // Crypto & KI · HoloNet</title>

<script src="https://unpkg.com/motion@11.11.17/dist/motion.js"></script>
<script src="https://unpkg.com/date-fns@4.1.0/cdn.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      void:   '#030508',
      panel:  'rgba(0,229,255,0.03)',
      line:   'rgba(0,229,255,0.16)',
      'line-hi': 'rgba(0,229,255,0.45)',
      cyan:   '#00e5ff',
      mag:    '#ff2e88',
      amber:  '#ffb300',
      red:    '#ff3b3b',
      green:  '#2aff8f',
      text:   '#d6ecf5',
      dim:    '#5d7a8a',
    },
    fontFamily: {
      sans: ['"IBM Plex Sans"','system-ui','sans-serif'],
      mono: ['"JetBrains Mono"','ui-monospace','monospace'],
    },
  } } };
</script>
<style>
  @font-face { font-family:'IBM Plex Sans'; font-weight:400; font-display:swap; src:url('./assets/fonts/IBMPlexSans-Regular.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Sans'; font-weight:500; font-display:swap; src:url('./assets/fonts/IBMPlexSans-Medium.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Sans'; font-weight:700; font-display:swap; src:url('./assets/fonts/IBMPlexSans-Bold.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:400; font-display:swap; src:url('./assets/fonts/JetBrainsMono-Regular.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:700; font-display:swap; src:url('./assets/fonts/JetBrainsMono-Bold.woff2') format('woff2'); }
  html { color-scheme: dark; }
  body {
    background:
      radial-gradient(ellipse 90% 50% at 50% -10%, rgba(0,229,255,0.06), transparent 60%),
      #030508;
    -webkit-font-smoothing: antialiased;
  }
  /* Star-Wars Scanline-Overlay */
  body::after {
    content:''; position: fixed; inset:0; z-index:50; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.022) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  .lucide { width:1em; height:1em; stroke-width:2; display:inline-block; vertical-align:-0.12em; }
  /* HUD-Rahmen: Eck-Marker */
  .hud { position:relative; }
  .hud::before, .hud::after,
  .hud > .corners::before, .hud > .corners::after {
    content:''; position:absolute; width:14px; height:14px; pointer-events:none;
    border-color: rgba(0,229,255,0.5); border-style:solid;
  }
  .hud::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
  .hud::after { top:-1px; right:-1px; border-width:1px 1px 0 0; }
  .hud > .corners::before { bottom:-1px; left:-1px; border-width:0 0 1px 1px; }
  .hud > .corners::after { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }
  .glow { text-shadow: 0 0 12px rgba(0,229,255,0.55); }
  .glow-mag { text-shadow: 0 0 12px rgba(255,46,136,0.55); }
  .tab[aria-selected="true"] {
    background: rgba(0,229,255,0.10); color: #00e5ff;
    border-color: rgba(0,229,255,0.45);
    box-shadow: 0 0 14px rgba(0,229,255,0.18), inset 0 0 10px rgba(0,229,255,0.06);
    text-shadow: 0 0 8px rgba(0,229,255,0.6);
  }
  ::selection { background: rgba(0,229,255,0.28); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.18); }
  ::-webkit-scrollbar-track { background: transparent; }
  select:focus, button:focus-visible, a:focus-visible { outline:1px solid rgba(0,229,255,0.6); outline-offset:2px; }
  .blink { animation: blink 1.6s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body class="bg-void text-text font-sans min-h-screen relative">

<header class="sticky top-0 z-20 border-b border-line bg-void/85 backdrop-blur-md">
  <div class="max-w-5xl mx-auto px-4 pt-3.5 pb-2.5 flex items-center gap-3">
    <span class="relative flex w-2.5 h-2.5 shrink-0">
      <span class="animate-ping absolute inline-flex h-full w-full bg-cyan opacity-50"></span>
      <span class="relative inline-flex w-2.5 h-2.5 bg-cyan blink"></span>
    </span>
    <div class="flex-1 min-w-0">
      <h1 class="text-[15px] font-bold tracking-[0.18em] uppercase glow leading-tight">Scanner</h1>
      <p class="text-[10px] text-dim font-mono mt-0.5 tracking-wider">HOLONET · CRYPTO & KI · CYCLE 15:00</p>
    </div>
    <span id="lastUpdate" class="text-[10px] text-dim font-mono whitespace-nowrap tracking-wider"></span>
  </div>
  <div class="max-w-5xl mx-auto px-4 pb-3">
    <nav id="tabs" role="tablist" class="grid grid-cols-3 gap-1 sm:flex sm:flex-wrap sm:gap-1">
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 border border-line text-[12px] font-mono uppercase tracking-wider text-dim hover:text-cyan hover:border-line-hi transition-colors" data-tab="home" role="tab"><i data-lucide="activity"></i> Home</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 border border-line text-[12px] font-mono uppercase tracking-wider text-dim hover:text-cyan hover:border-line-hi transition-colors" data-tab="crypto" role="tab"><i data-lucide="bitcoin"></i> Crypto</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 border border-line text-[12px] font-mono uppercase tracking-wider text-dim hover:text-cyan hover:border-line-hi transition-colors" data-tab="ai" role="tab"><i data-lucide="cpu"></i> AI</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 border border-line text-[12px] font-mono uppercase tracking-wider text-dim hover:text-cyan hover:border-line-hi transition-colors" data-tab="learn" role="tab"><i data-lucide="book-open"></i> Learn</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 border border-line text-[12px] font-mono uppercase tracking-wider text-dim hover:text-cyan hover:border-line-hi transition-colors" data-tab="live" role="tab"><i data-lucide="radio"></i> Live</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 border border-line text-[12px] font-mono uppercase tracking-wider text-dim hover:text-cyan hover:border-line-hi transition-colors" data-tab="links" role="tab"><i data-lucide="link-2"></i> Links</button>
    </nav>
  </div>
</header>

<div id="filterBar" class="max-w-5xl mx-auto px-4 pt-4 hidden">
  <div class="flex gap-2 flex-wrap">
    <select id="catFilter" class="bg-panel text-text border border-line rounded-none px-3 py-2 text-[12px] font-mono max-w-full"></select>
    <select id="scoreFilter" class="bg-panel text-text border border-line rounded-none px-3 py-2 text-[12px] font-mono">
      <option value="">Standard-Score</option><option value="0">Alle (ohne Mindest-Score)</option>
      <option value="6">≥ 6</option><option value="7">≥ 7</option><option value="8">≥ 8</option><option value="9">≥ 9</option>
    </select>
  </div>
</div>

<main id="content" class="max-w-5xl mx-auto px-4 py-5 relative z-10"></main>

<footer class="max-w-5xl mx-auto px-4 pt-10 pb-8 text-center text-dim text-[10px] font-mono tracking-widest uppercase">
  HoloNet-Übertragung · Tailwind · Lucide · Motion · date-fns
</footer>

<script>
/* Scanner v2 — Star-Wars HUD · gleiche Daten & Funktionen */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NTFY_TOPIC = "crypto-scanner-report-9f3k2";
let currentTab = 'home';
let newsCache = null, categoryCache = null;
const SCORE_DEFAULT = { crypto: 8, ai: 7 };

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  currentTab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t === b ? 'true' : 'false'));
  const newsTab = currentTab === 'crypto' || currentTab === 'ai';
  $('#filterBar').classList.toggle('hidden', !newsTab);
  if (newsTab) { $('#catFilter').innerHTML = '<option value="">Alle Kategorien</option>'; $('#scoreFilter').value = ''; }
  refresh();
});

async function loadNews() {
  if (!newsCache) newsCache = await (await fetch('./data/news.json', {cache:'no-store'})).json();
  if (!categoryCache) categoryCache = await (await fetch('./data/categories.json', {cache:'no-store'})).json();
  renderNewsCards();
}
function relTime(iso){
  if(!iso) return '';
  try{ const d=new Date(iso.replace('Z','+00:00'));
    if(window.dateFns && dateFns.formatDistanceToNow) return 'vor '+dateFns.formatDistanceToNow(d,{locale:dateFns.locale.de,addSuffix:false});
  }catch{}
  const m=Math.round((Date.now()-new Date(iso.replace('Z','+00:00')).getTime())/60000);
  if(m<1) return 'gerade eben'; if(m<60) return `vor ${m} Min.`;
  const h=Math.round(m/60); if(h<24) return `vor ${h} Std.`; return `vor ${Math.round(h/24)} Tagen`;
}
function safeUrl(u){ try{ const x=new URL(u); return (x.protocol==='https:'||x.protocol==='http:')?u:'#'; }catch{ return '#'; } }
function scoreClass(s){ return s>=9?'bg-mag/15 text-mag border-mag/40':s>=8?'bg-amber/15 text-amber border-amber/40':s>=7?'bg-cyan/10 text-cyan border-line-hi':'bg-green/10 text-green border-green/40'; }
function renderNewsCards() {
  const el = $('#content');
  const catSel = $('#catFilter');
  const cats = (categoryCache[currentTab] || []);
  if (catSel.options.length <= 1) {
    catSel.innerHTML = '<option value="">Alle Kategorien</option>' + cats.map(c=>`<option>${esc(c)}</option>`).join('');
    catSel.onchange = renderNewsCards;
    $('#scoreFilter').onchange = renderNewsCards;
  }
  const rawScore = $('#scoreFilter').value;
  const minScore = rawScore === '' ? (SCORE_DEFAULT[currentTab] || 0) : Number(rawScore);
  const selCat = catSel.value;
  const list = newsCache
    .filter(a => a.stream === currentTab)
    .filter(a => !selCat || a.category === selCat)
    .filter(a => Number(a.score || 0) >= minScore)
    .slice(0, 60);
  if (!list.length) { el.innerHTML = '<div class="text-center text-dim py-16 text-[12.5px] font-mono uppercase tracking-widest">// Keine Signale in dieser Auswahl</div>'; return; }
  el.innerHTML = list.map((a) => `
    <article class="hud border border-line bg-panel p-4 mb-3 hover:border-line-hi transition-colors" data-anim>
      <span class="corners"></span>
      <div class="flex items-center gap-2.5 flex-wrap">
        <span class="font-mono text-[11px] font-bold px-2 py-0.5 border ${scoreClass(a.score||0)}">${esc(a.score)}/10</span>
        <span class="text-[11px] text-dim font-mono uppercase tracking-wider">${esc(a.category||'')}</span>
        <span class="inline-flex items-center gap-1 text-[10px] text-dim font-mono ml-auto uppercase tracking-wider"><i data-lucide="clock"></i>${esc(relTime(a.published))}</span>
      </div>
      <h3 class="text-[15px] font-semibold mt-2.5 mb-1.5 leading-snug tracking-tight">
        <a class="hover:text-cyan transition-colors" href="${esc(safeUrl(a.url||'#'))}" target="_blank" rel="noopener">${esc(a.title||'')}</a></h3>
      <p class="text-[13px] text-dim leading-relaxed">${esc(a.summary||'')}</p>
      <div class="mt-3"><a class="inline-flex items-center gap-1 text-[11.5px] font-mono uppercase tracking-wider text-cyan hover:glow" href="${esc(safeUrl(a.url||'#'))}" target="_blank" rel="noopener">Quelle <i data-lucide="arrow-up-right"></i></a></div>
    </article>`).join('');
  animateCards(); lucide.createIcons();
}

/* ---- Home: Marktbericht + Zahlen (HUD) ---- */
function cleanReport(t){ return String(t||'').replace(/\\n/g,'\n').replace(/\*\*/g,'').replace(/#{1,3} /g,''); }
let sessionCache = null;
function berlinParts(ts){ const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  return Object.fromEntries(f.formatToParts(ts).filter(x=>x.type!=='literal').map(x=>[x.type,x.value])); }
function berlinToUtc(y,mo,d,hh,mm){ for(const off of [2,1]){ const t=Date.UTC(y,mo,d,hh-off,mm); const p=berlinParts(new Date(t));
  if(+p.year===y&&+p.month-1===mo&&+p.day===d&&+p.hour===hh&&+p.minute===mm) return t; } return Date.UTC(y,mo,d,hh-2,mm); }
async function ensureSessionCache(){
  if (sessionCache) return sessionCache;
  try{ const [hist,snap]=await Promise.all([
      fetch('./data/history.json',{cache:'no-store'}).then(r=>r.json()),
      fetch('./data/snapshot.json',{cache:'no-store'}).then(r=>r.json())]);
    const p=berlinParts(new Date()); const y=+p.year,mo=+p.month-1,d=+p.day,hh=+p.hour,mm=+p.minute; let ref,label;
    if(hh*60+mm>=15*60+30){ ref=berlinToUtc(y,mo,d,15,30); label='seit US-Open 15:30'; }
    else { ref=berlinToUtc(y,mo,d-1,22,0); label='seit US-Close 22:00'; }
    sessionCache={hist:hist||[],snap:(snap&&snap.instruments)||{},ref,label};
  }catch{ sessionCache={hist:[],snap:{},ref:0,label:''}; }
  return sessionCache;
}
function sessionChange(sym){ const c=sessionCache; if(!c||!c.hist.length) return null;
  const cur=c.snap[sym]&&c.snap[sym].value; if(cur==null) return null; let refVal=null;
  for(const h of c.hist){ const ts=new Date((h.ts||'').replace('Z','+00:00')).getTime(); if(Number.isNaN(ts)) continue;
    if(ts<=c.ref) refVal=(h.instruments[sym]||{}).value; else break; }
  if(refVal==null||!refVal) return null; return ((cur-refVal)/Math.abs(refVal))*100; }
function fmtVal(v){ if(v==null) return '—'; return v>=1000?v.toLocaleString('de-DE',{maximumFractionDigits:0}):v>=10?v.toFixed(2):v.toFixed(4); }
function fmtPct(p){ if(p==null||Number.isNaN(p)) return '<span class="text-dim font-mono">—</span>';
  return p>=0
    ? `<span class="text-green font-mono inline-flex items-center gap-0.5">▲ +${p.toFixed(2)} %</span>`
    : `<span class="text-mag font-mono inline-flex items-center gap-0.5">▼ ${p.toFixed(2)} %</span>`; }
function numbersTable(numbers){
  if(!numbers||!numbers.length) return '';
  const lbl=sessionCache&&sessionCache.label?esc(sessionCache.label):'';
  const rows=numbers.map(n=>`<tr class="border-b border-line/50 last:border-0 hover:bg-cyan/[0.03] transition-colors">
    <td class="py-2 pr-3 pl-3 font-mono text-[12px] text-text">${esc(n.sym)}${n.label?` <span class="text-dim text-[10px]">${esc(n.label)}</span>`:''}</td>
    <td class="py-2 pr-3 font-mono text-[12.5px]">${fmtVal(n.value)}</td>
    <td class="py-2 pr-3 text-[11px]">${fmtPct(n.change)}</td>
    <td class="py-2 pr-3 text-[11px]">${fmtPct(sessionChange(n.sym))}</td></tr>`).join('');
  return `<div class="hud border border-line bg-panel overflow-x-auto"><span class="corners"></span><table class="w-full border-collapse">
    <thead><tr class="border-b border-line text-left text-dim text-[10px] uppercase tracking-widest font-mono">
    <th class="py-2 pr-3 pl-3 font-medium">Instrument</th><th class="py-2 pr-3 font-medium">Wert</th>
    <th class="py-2 pr-3 font-medium">24H</th><th class="py-2 pr-3 font-medium">Session${lbl?' · '+lbl:''}</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
async function renderHome(){
  const el=$('#content'); await ensureSessionCache(); let rep=null;
  try{ const r=await fetch('./data/market-report.json',{cache:'no-store'}); if(r.ok) rep=await r.json(); }catch{}
  const slots='09:00 · 15:30 · 22:00 Uhr';
  const reportTs=rep&&rep.ts?rep.ts:'';
  const ageH=reportTs?(Date.now()-new Date(reportTs.replace('Z','+00:00')).getTime())/36e5:null;
  const staleNote=ageH!==null&&ageH>8?`<div class="mb-3 border border-amber/40 bg-amber/10 text-amber text-[11.5px] font-mono px-3 py-2 flex items-start gap-2 uppercase tracking-wider"><i data-lucide="alert-triangle" class="mt-0.5 shrink-0"></i><span>Signal veraltet — Bericht ist ${ageH>=24?Math.floor(ageH/24)+' Tage':Math.round(ageH)+' Stunden'} alt · neu anfordern</span></div>`:'';
  el.innerHTML=`
    <div class="flex items-center gap-2 mb-3"><span class="w-1.5 h-1.5 bg-cyan blink"></span><h2 class="text-[11px] text-dim uppercase tracking-widest font-mono">Marktbericht · KI-Einschätzung</h2></div>
    ${rep&&rep.text?`
    <div class="hud border border-line bg-panel p-5" data-anim>
      <span class="corners"></span>
      ${staleNote}
      <div class="text-[10.5px] text-dim font-mono mb-3 uppercase tracking-widest">${rep.ts?esc(window.dateFns.format(new Date(rep.ts.replace('Z','+00:00')),'dd.MM.yyyy · HH:mm')):'—'} · ${rep.instrument==='ALL'?'Gesamtmarkt':esc(rep.instrument)}</div>
      <div class="text-[14px] leading-relaxed whitespace-pre-wrap text-text/95">${esc(cleanReport(rep.text))}</div>
      <div class="flex items-center gap-3 flex-wrap mt-4">
        <button id="repNowBtn" class="inline-flex items-center gap-1.5 border border-cyan/50 bg-cyan/10 text-cyan font-mono uppercase tracking-wider text-[11.5px] px-4 py-2 hover:bg-cyan/20 transition-colors disabled:opacity-40">
          <i data-lucide="refresh-cw"></i>Bericht anfordern</button>
        <div id="repNowStatus" class="text-[10.5px] text-dim font-mono uppercase tracking-wider">auto ${slots} · manuell ~1–3 min</div>
      </div>
    </div>`:`<div class="text-center text-dim py-16 text-[12px] font-mono uppercase tracking-widest">// Kein Bericht — automatisch um ${slots}</div>`}
    ${rep&&rep.numbers&&rep.numbers.length?`<div class="flex items-center gap-2 mb-3 mt-7"><span class="w-1.5 h-1.5 bg-mag blink"></span><h2 class="text-[11px] text-dim uppercase tracking-widest font-mono">Zahlen</h2></div><div data-anim>${numbersTable(rep.numbers)}</div>`:''}
    <p class="text-[10px] text-dim font-mono uppercase tracking-widest mt-4">KI-Einordnung aus Snapshot, 12h-Verlauf und Top-News — keine Finanzberatung</p>`;
  lucide.createIcons(); animateCards(); attachReportButton(reportTs);
}
function attachReportButton(reportTs){
  const btn=$('#repNowBtn'); if(!btn) return;
  btn.addEventListener('click', async ()=>{
    btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="animate-spin"></i>übertrage …'; lucide.createIcons();
    $('#repNowStatus').textContent='Übertragung — Cloud erstellt Bericht (1–3 min) …';
    let sent=false;
    try{ const r=await fetch(`https://ntfy.sh/${NTFY_TOPIC}`,{method:'POST',body:'market-report',mode:'cors'}); sent=r.ok; }catch{}
    if(!sent){ $('#repNowStatus').textContent='Übertragung fehlgeschlagen — erneut versuchen.'; btn.disabled=false;
      btn.innerHTML='<i data-lucide="refresh-cw"></i>Bericht anfordern'; lucide.createIcons(); return; }
    for(let i=0;i<36;i++){ await new Promise(r=>setTimeout(r,5000));
      try{ const r2=await fetch('./data/market-report.json',{cache:'no-store'}); const rep2=await r2.json();
        if(rep2&&rep2.ts&&rep2.ts!==reportTs){ renderHome(); return; } }catch{} }
    $('#repNowStatus').textContent='angefordert — Cloud bis 3 min · Seite neu laden.';
    btn.disabled=false; btn.innerHTML='<i data-lucide="refresh-cw"></i>Bericht anfordern'; lucide.createIcons();
  });
}

/* ---- Learn ---- */
async function renderLearn(){
  const el=$('#content');
  let data;
  try{ data=await (await fetch('./data/learn.json',{cache:'no-store'})).json(); }
  catch{ el.innerHTML='<div class="text-center text-dim py-16 text-[12px] font-mono uppercase tracking-widest">// Lern-Daten nicht verfügbar</div>'; return; }
  const sections=data.sections||[];
  el.innerHTML='<p class="text-[11.5px] text-dim font-mono uppercase tracking-widest mb-4">// Erklärungen zu Funktionen und Werten</p>'+
    sections.map(s=>`
    <div class="flex items-center gap-2 mt-7 mb-3"><span class="w-1.5 h-1.5 bg-cyan"></span><h2 class="text-[11px] text-dim uppercase tracking-widest font-mono">${s.emoji?esc(s.emoji)+' ':''}${esc(s.title)}</h2></div>
    ${s.intro?`<p class="text-[12px] text-dim mb-3">${esc(s.intro)}</p>`:''}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${(s.cards||[]).map(c=>`
      <div class="hud border border-line bg-panel p-4 hover:border-line-hi transition-colors" data-anim>
        <span class="corners"></span>
        <div class="text-[13.5px] font-semibold flex items-center gap-1.5 flex-wrap tracking-tight">${esc(c.title)}${c.tag?`<span class="text-[9.5px] text-cyan bg-cyan/10 border border-line font-mono uppercase px-1.5 py-0.5">${esc(c.tag)}</span>`:''}</div>
        <div class="text-[12px] text-dim leading-relaxed mt-1.5">${esc(c.body)}</div>
      </div>`).join('')}</div>`).join('');
  animateCards();
}

/* ---- Links ---- */
async function renderLinks(){
  const el=$('#content');
  const data=await (await fetch('./data/links.json',{cache:'no-store'})).json();
  const groups={};
  (data.links||[]).forEach(l=>{ (groups[l.group||'Weitere']=groups[l.group||'Weitere']||[]).push(l); });
  el.innerHTML=(data.note?`<p class="text-[11.5px] text-dim font-mono uppercase tracking-widest mb-4">// ${esc(data.note)}</p>`:'')+
    Object.entries(groups).map(([g,items])=>`
    <div class="flex items-center gap-2 mt-7 mb-3"><span class="w-1.5 h-1.5 bg-mag"></span><h2 class="text-[11px] text-dim uppercase tracking-widest font-mono">${esc(g)}</h2></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${items.map(l=>`
      <div class="hud border border-line bg-panel p-4 flex flex-col gap-2 hover:border-line-hi transition-colors" data-anim>
        <span class="corners"></span>
        <div class="text-[14px] font-semibold tracking-tight">${l.emoji?esc(l.emoji)+' ':''}${esc(l.name)}</div>
        <div class="text-[12px] text-dim flex-1 leading-relaxed">${esc(l.desc||'')}</div>
        <a class="self-start inline-flex items-center gap-1 text-[11.5px] font-mono uppercase tracking-wider text-cyan hover:glow" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">Öffnen <i data-lucide="arrow-up-right"></i></a>
      </div>`).join('')}</div>`).join('');
  animateCards(); lucide.createIcons();
}

/* ---- Live (1:1 aus v1) ---- */
const EMBEDS = [
  { id: "cg-liq", label: "Liquidations-Heatmap", url: "https://www.coinglass.com/pro/futures/LiquidationHeatMap", note: "Coinglass · Liquidations-Level je Preiszone" },
  { id: "cg-liqall", label: "Live-Liquidationen", url: "https://www.coinglass.com/liquidations", note: "Coinglass · alle Coins, laufende Liquidationen" },
  { id: "cg-funding", label: "Funding Rates", url: "https://www.coinglass.com/FundingRate", note: "Coinglass · Finanzierungsraten je Börse" },
  { id: "cg-orderbook", label: "Order Book", url: "https://www.coinglass.com/mergev2/BTC-USDT", note: "Coinglass · Order-Depth BTC/USDT (Market Depth)" },
  { id: "tv-chart", label: "BTC-Chart", url: "https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=60&theme=dark&style=1&locale=de_DE&hideideas=1&withdateranges=1", note: "TradingView · BTC/USDT 1h (offizielles Widget)" },
];
let currentEmbed = "cg-liq";
async function renderLive(){
  const el=$('#content');
  const emb=EMBEDS.find(e=>e.id===currentEmbed)||EMBEDS[0];
  const chips=EMBEDS.map(e=>`
    <button class="px-3 py-1.5 border font-mono uppercase tracking-wider text-[11px] transition-colors ${e.id===emb.id?'border-cyan/50 bg-cyan/10 text-cyan glow':'border-line bg-panel text-dim hover:text-cyan hover:border-line-hi'}" data-embed="${e.id}">${esc(e.label)}</button>`).join('');
  el.innerHTML=`
    <div class="flex items-center gap-1.5 flex-wrap">${chips}
      <a class="ml-auto inline-flex items-center gap-1 text-[11px] font-mono uppercase tracking-wider text-cyan hover:glow" href="${esc(safeUrl(emb.url))}" target="_blank" rel="noopener noreferrer">Original <i data-lucide="arrow-up-right"></i></a>
    </div>
    <div class="pt-3 hud"><span class="corners"></span><iframe class="w-full border border-line bg-black block" style="height:calc(100vh - 240px);min-height:480px" src="${esc(safeUrl(emb.url))}" allow="fullscreen" title="${esc(emb.label)}"></iframe></div>
    <p class="pt-2.5 text-[10px] text-dim font-mono uppercase tracking-widest">Externe Live-Seite: ${esc(emb.note)} · Datenschutz des Anbieters</p>`;
  el.querySelectorAll('[data-embed]').forEach(c=>c.addEventListener('click',()=>{ currentEmbed=c.dataset.embed; renderLive(); }));
  lucide.createIcons();
}

/* ---- Router + Init ---- */
async function refresh(){
  if(currentTab==='home') await renderHome();
  else if(currentTab==='links') await renderLinks();
  else if(currentTab==='live') await renderLive();
  else if(currentTab==='learn') await renderLearn();
  else await loadNews();
}
function animateCards(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!window.Motion) return;
  window.Motion.animate('[data-anim]', {opacity:[0,1],transform:['translateY(10px)','translateY(0)']},
    {duration:0.3,delay:window.Motion.stagger(0.04),easing:'ease-out'});
}
async function loadStats(){ try{ const s=await (await fetch('./data/stats.json',{cache:'no-store'})).json();
  $('#lastUpdate').textContent=s.generated_at?('SYNC '+window.dateFns.format(new Date(s.generated_at.replace('Z','+00:00')),'dd.MM. HH:mm')):''; }catch{} }

document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===currentTab?'true':'false'));
refresh(); loadStats(); lucide.createIcons();
</script>
</body>
