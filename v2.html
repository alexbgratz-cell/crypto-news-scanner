<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ntfy.sh; font-src 'self'; frame-src https://www.coinglass.com https://s.tradingview.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>News-Scanner v2 · Crypto & KI</title>
<!-- Baukasten: Tailwind (Utility), Lucide (Icons), Motion (Animation), date-fns (Datum), IBM Plex Sans + JetBrains Mono (Typo, self-hosted) -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/motion@11.11.17/dist/motion.js"></script>
<script src="https://unpkg.com/date-fns@4.1.0/cdn.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      bg:      '#0b0d11',
      card:    'rgba(255,255,255,0.025)',
      border:  'rgba(255,255,255,0.07)',
      'border-strong': 'rgba(255,255,255,0.15)',
      text:    '#e8ebf0',
      muted:   '#8b93a3',
      accent:  '#5b9dff',
      green:   '#34d399',
      red:     '#f87171',
      amber:   '#fbbf24',
    },
    fontFamily: {
      sans: ['"IBM Plex Sans"','system-ui','sans-serif'],
      mono: ['"JetBrains Mono"','ui-monospace','monospace'],
    },
  } } };
</script>
<style>
  @font-face { font-family:'IBM Plex Sans'; font-weight:400; font-display:swap;
    src:url('./assets/fonts/IBMPlexSans-Regular.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Sans'; font-weight:500; font-display:swap;
    src:url('./assets/fonts/IBMPlexSans-Medium.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Sans'; font-weight:700; font-display:swap;
    src:url('./assets/fonts/IBMPlexSans-Bold.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:400; font-display:swap;
    src:url('./assets/fonts/JetBrainsMono-Regular.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-weight:700; font-display:swap;
    src:url('./assets/fonts/JetBrainsMono-Bold.woff2') format('woff2'); }
  html { color-scheme: dark; scroll-behavior: smooth; }
  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body::before { /* dezenter Akzent-Glow oben */
    content:''; position: fixed; top:-180px; left:50%; transform:translateX(-50%);
    width:640px; height:320px; pointer-events:none; z-index:0;
    background: radial-gradient(closest-side, rgba(91,157,255,0.07), transparent);
  }
  .lucide { width:1em; height:1em; stroke-width:2; display:inline-block; vertical-align:-0.12em; }
  .tab[aria-selected="true"] { background:rgba(255,255,255,0.09); color:#e8ebf0; }
  ::selection { background:rgba(91,157,255,0.32); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.09); border-radius:8px; border:2px solid #0b0d11; }
  ::-webkit-scrollbar-track { background:transparent; }
  select:focus, button:focus-visible, a:focus-visible { outline:2px solid rgba(91,157,255,0.55); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body class="bg-bg text-text font-sans min-h-screen relative">

<header class="sticky top-0 z-20 border-b border-border bg-bg/80 backdrop-blur-xl">
  <div class="max-w-4xl mx-auto px-5 pt-4 pb-3 flex items-center gap-3">
    <span class="relative flex w-2 h-2 shrink-0">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green opacity-60"></span>
      <span class="relative inline-flex rounded-full w-2 h-2 bg-green"></span>
    </span>
    <div class="flex-1 min-w-0">
      <h1 class="text-[16px] font-semibold tracking-tight leading-tight">News-Scanner</h1>
      <p class="text-[11px] text-muted font-mono mt-0.5">Crypto & KI · alle 15 min</p>
    </div>
    <span id="lastUpdate" class="text-[11px] text-muted font-mono whitespace-nowrap"></span>
  </div>
  <div class="max-w-4xl mx-auto px-5 pb-3.5">
    <nav id="tabs" role="tablist" class="grid grid-cols-3 gap-1 p-1 rounded-2xl border border-border bg-white/[0.02] sm:inline-flex sm:rounded-full">
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl sm:rounded-full text-[13px] font-medium text-muted hover:text-text transition-colors" data-tab="home" role="tab"><i data-lucide="activity"></i> Home</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl sm:rounded-full text-[13px] font-medium text-muted hover:text-text transition-colors" data-tab="crypto" role="tab"><i data-lucide="bitcoin"></i> Crypto</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl sm:rounded-full text-[13px] font-medium text-muted hover:text-text transition-colors" data-tab="ai" role="tab"><i data-lucide="cpu"></i> AI</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl sm:rounded-full text-[13px] font-medium text-muted hover:text-text transition-colors" data-tab="learn" role="tab"><i data-lucide="book-open"></i> Learn</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl sm:rounded-full text-[13px] font-medium text-muted hover:text-text transition-colors" data-tab="live" role="tab"><i data-lucide="radio"></i> Live</button>
      <button class="tab flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl sm:rounded-full text-[13px] font-medium text-muted hover:text-text transition-colors" data-tab="links" role="tab"><i data-lucide="link-2"></i> Links</button>
    </nav>
  </div>
</header>

<div id="filterBar" class="max-w-4xl mx-auto px-5 pt-4 hidden">
  <div class="flex gap-2 flex-wrap">
    <select id="catFilter" class="bg-white/[0.03] text-text border border-border rounded-xl px-3 py-2 text-[13px] max-w-full"></select>
    <select id="scoreFilter" class="bg-white/[0.03] text-text border border-border rounded-xl px-3 py-2 text-[13px]">
      <option value="">Standard-Score</option><option value="0">Alle (ohne Mindest-Score)</option>
      <option value="6">≥ 6</option><option value="7">≥ 7</option><option value="8">≥ 8</option><option value="9">≥ 9</option>
    </select>
  </div>
</div>

<main id="content" class="max-w-4xl mx-auto px-5 py-6 relative z-10"></main>

<footer class="max-w-4xl mx-auto px-5 pt-10 pb-8 text-center text-muted text-[11px] font-mono">
  News-Scanner v2 · Tailwind · Lucide · Motion · date-fns · IBM Plex / JetBrains Mono
</footer>

<script>
/* ============================================================
   Scanner v2 — gleiche Daten & Funktionen, neues Design
   ============================================================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NTFY_TOPIC = "crypto-scanner-report-9f3k2";
let currentTab = 'home';
let newsCache = null, categoryCache = null;
const SCORE_DEFAULT = { crypto: 8, ai: 7 };

/* ---- Tabs ---- */
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  currentTab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t === b ? 'true' : 'false'));
  const newsTab = currentTab === 'crypto' || currentTab === 'ai';
  $('#filterBar').classList.toggle('hidden', !newsTab);
  if (newsTab) { $('#catFilter').innerHTML = '<option value="">Alle Kategorien</option>'; $('#scoreFilter').value = ''; }
  refresh();
});

/* ---- News ---- */
async function loadNews() {
  if (!newsCache) newsCache = await (await fetch('./data/news.json', {cache:'no-store'})).json();
  if (!categoryCache) categoryCache = await (await fetch('./data/categories.json', {cache:'no-store'})).json();
  renderNewsCards();
}
function relTime(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso.replace('Z','+00:00'));
    if(window.dateFns && dateFns.formatDistanceToNow){
      return 'vor ' + dateFns.formatDistanceToNow(d, {locale: dateFns.locale.de, addSuffix:false});
    }
  }catch{}
  const m = Math.round((Date.now()-new Date(iso.replace('Z','+00:00')).getTime())/60000);
  if(m<1) return 'gerade eben'; if(m<60) return `vor ${m} Min.`;
  const h=Math.round(m/60); if(h<24) return `vor ${h} Std.`; return `vor ${Math.round(h/24)} Tagen`;
}
function safeUrl(u){ try{ const x=new URL(u); return (x.protocol==='https:'||x.protocol==='http:')?u:'#'; }catch{ return '#'; } }
function scoreClass(s){ return s>=9?'bg-red/10 text-red':s>=8?'bg-amber/10 text-amber':s>=7?'bg-amber/10 text-amber/80':'bg-green/10 text-green'; }
function renderNewsCards() {
  const el = $('#content');
  const catSel = $('#catFilter');
  const cats = (categoryCache[currentTab] || []);
  if (catSel.options.length <= 1) {
    catSel.innerHTML = '<option value="">Alle Kategorien</option>' + cats.map(c=>`<option>${esc(c)}</option>`).join('');
    catSel.onchange = renderNewsCards;
    $('#scoreFilter').onchange = renderNewsCards;
  }
  const rawScore = $('#scoreFilter').value;
  const minScore = rawScore === '' ? (SCORE_DEFAULT[currentTab] || 0) : Number(rawScore);
  const selCat = catSel.value;
  const list = newsCache
    .filter(a => a.stream === currentTab)
    .filter(a => !selCat || a.category === selCat)
    .filter(a => Number(a.score || 0) >= minScore)
    .slice(0, 60);
  if (!list.length) { el.innerHTML = '<div class="text-center text-muted py-16 text-[13.5px]">Keine Artikel in dieser Auswahl.</div>'; return; }
  el.innerHTML = list.map((a) => `
    <article class="group border border-border bg-card rounded-2xl p-4 mb-3 hover:border-border-strong transition-colors" data-anim>
      <div class="flex items-center gap-2.5 flex-wrap">
        <span class="font-mono text-[11px] font-bold px-2 py-0.5 rounded-full ${scoreClass(a.score||0)}">${esc(a.score)}/10</span>
        <span class="text-[12px] text-muted">${esc(a.category||'')}</span>
        <span class="inline-flex items-center gap-1 text-[11px] text-muted font-mono ml-auto"><i data-lucide="clock"></i>${esc(relTime(a.published))}</span>
      </div>
      <h3 class="text-[15px] font-medium mt-2 mb-1 leading-snug tracking-tight">
        <a class="hover:text-accent transition-colors" href="${esc(safeUrl(a.url||'#'))}" target="_blank" rel="noopener">${esc(a.title||'')}</a></h3>
      <p class="text-[13.5px] text-muted leading-relaxed">${esc(a.summary||'')}</p>
      <div class="mt-2.5"><a class="inline-flex items-center gap-1 text-[12.5px] font-medium text-accent hover:underline" href="${esc(safeUrl(a.url||'#'))}" target="_blank" rel="noopener">Quelle <i data-lucide="arrow-up-right"></i></a></div>
    </article>`).join('');
  animateCards(); lucide.createIcons();
}

/* ---- Home: Marktbericht + Zahlen ---- */
function cleanReport(t){ return String(t||'').replace(/\\n/g,'\n').replace(/\*\*/g,'').replace(/#{1,3} /g,''); }
let sessionCache = null;
function berlinParts(ts){ const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  return Object.fromEntries(f.formatToParts(ts).filter(x=>x.type!=='literal').map(x=>[x.type,x.value])); }
function berlinToUtc(y,mo,d,hh,mm){ for(const off of [2,1]){ const t=Date.UTC(y,mo,d,hh-off,mm); const p=berlinParts(new Date(t));
  if(+p.year===y&&+p.month-1===mo&&+p.day===d&&+p.hour===hh&&+p.minute===mm) return t; } return Date.UTC(y,mo,d,hh-2,mm); }
async function ensureSessionCache(){
  if (sessionCache) return sessionCache;
  try{ const [hist,snap]=await Promise.all([
      fetch('./data/history.json',{cache:'no-store'}).then(r=>r.json()),
      fetch('./data/snapshot.json',{cache:'no-store'}).then(r=>r.json())]);
    const p=berlinParts(new Date()); const y=+p.year,mo=+p.month-1,d=+p.day,hh=+p.hour,mm=+p.minute; let ref,label;
    if(hh*60+mm>=15*60+30){ ref=berlinToUtc(y,mo,d,15,30); label='seit US-Open 15:30'; }
    else { ref=berlinToUtc(y,mo,d-1,22,0); label='seit US-Close 22:00'; }
    sessionCache={hist:hist||[],snap:(snap&&snap.instruments)||{},ref,label};
  }catch{ sessionCache={hist:[],snap:{},ref:0,label:''}; }
  return sessionCache;
}
function sessionChange(sym){ const c=sessionCache; if(!c||!c.hist.length) return null;
  const cur=c.snap[sym]&&c.snap[sym].value; if(cur==null) return null; let refVal=null;
  for(const h of c.hist){ const ts=new Date((h.ts||'').replace('Z','+00:00')).getTime(); if(Number.isNaN(ts)) continue;
    if(ts<=c.ref) refVal=(h.instruments[sym]||{}).value; else break; }
  if(refVal==null||!refVal) return null; return ((cur-refVal)/Math.abs(refVal))*100; }
function fmtVal(v){ if(v==null) return '–'; return v>=1000?v.toLocaleString('de-DE',{maximumFractionDigits:0}):v>=10?v.toFixed(2):v.toFixed(4); }
function fmtPct(p){ if(p==null||Number.isNaN(p)) return '<span class="text-muted font-mono">–</span>';
  const cls=p>=0?'text-green':'text-red'; const ic=p>=0?'trending-up':'trending-down';
  return `<span class="${cls} font-mono inline-flex items-center gap-0.5"><i data-lucide="${ic}"></i>${p>=0?'+':''}${p.toFixed(2)} %</span>`; }
function numbersTable(numbers){
  if(!numbers||!numbers.length) return '';
  const lbl=sessionCache&&sessionCache.label?esc(sessionCache.label):'';
  const rows=numbers.map(n=>`<tr class="border-b border-border/60 last:border-0 hover:bg-white/[0.02] transition-colors">
    <td class="py-2 pr-3 pl-4 font-mono text-[12.5px]">${esc(n.sym)}${n.label?` <span class="text-muted text-[10px]">${esc(n.label)}</span>`:''}</td>
    <td class="py-2 pr-3 font-mono text-[13px]">${fmtVal(n.value)}</td>
    <td class="py-2 pr-3">${fmtPct(n.change)}</td>
    <td class="py-2 pr-4">${fmtPct(sessionChange(n.sym))}</td></tr>`).join('');
  return `<div class="overflow-x-auto rounded-2xl border border-border bg-card"><table class="w-full border-collapse">
    <thead><tr class="border-b border-border text-left text-muted text-[10.5px] uppercase tracking-widest font-mono">
    <th class="py-2.5 pr-3 pl-4 font-medium">Instrument</th><th class="py-2.5 pr-3 font-medium">Wert</th>
    <th class="py-2.5 pr-3 font-medium">24h</th><th class="py-2.5 pr-4 font-medium">Session${lbl?' · '+lbl:''}</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
async function renderHome(){
  const el=$('#content'); await ensureSessionCache(); let rep=null;
  try{ const r=await fetch('./data/market-report.json',{cache:'no-store'}); if(r.ok) rep=await r.json(); }catch{}
  const slots='09:00 · 15:30 · 22:00 Uhr';
  const reportTs=rep&&rep.ts?rep.ts:'';
  const ageH=reportTs?(Date.now()-new Date(reportTs.replace('Z','+00:00')).getTime())/36e5:null;
  const staleNote=ageH!==null&&ageH>8?`<div class="mb-3 rounded-xl border border-amber/25 bg-amber/10 text-amber text-[12.5px] px-3 py-2.5 flex items-start gap-2"><i data-lucide="alert-triangle" class="mt-0.5 shrink-0"></i><span>Bericht ist ${ageH>=24?Math.floor(ageH/24)+' Tage':Math.round(ageH)+' Stunden'} alt — bitte neu anfordern.</span></div>`:'';
  el.innerHTML=`
    <h2 class="text-[12px] text-muted uppercase tracking-widest font-mono mb-3">Marktbericht · KI-Einschätzung</h2>
    ${rep&&rep.text?`
    <div class="border border-border bg-card rounded-2xl p-5" data-anim>
      ${staleNote}
      <div class="text-[11.5px] text-muted font-mono mb-3">${rep.ts?esc(window.dateFns.format(new Date(rep.ts.replace('Z','+00:00')),'dd.MM.yyyy HH:mm')):'–'} · ${rep.instrument==='ALL'?'Gesamtmarkt':esc(rep.instrument)}</div>
      <div class="text-[14.5px] leading-relaxed whitespace-pre-wrap text-text/95">${esc(cleanReport(rep.text))}</div>
      <div class="flex items-center gap-3 flex-wrap mt-4">
        <button id="repNowBtn" class="inline-flex items-center gap-1.5 rounded-full bg-accent text-[#0b0d11] font-semibold text-[13px] px-4 py-2 hover:bg-accent/85 transition-colors disabled:opacity-50">
          <i data-lucide="refresh-cw"></i>Neuen Marktbericht anfordern</button>
        <div id="repNowStatus" class="text-[12px] text-muted">Automatisch um ${slots} · manuell ~1–3 min (Cloud)</div>
      </div>
    </div>`:`<div class="text-center text-muted py-16 text-[13.5px]">Noch kein Bericht — automatisch um ${slots}.</div>`}
    ${rep&&rep.numbers&&rep.numbers.length?`<h2 class="text-[12px] text-muted uppercase tracking-widest font-mono mb-3 mt-8">Zahlen</h2><div data-anim>${numbersTable(rep.numbers)}</div>`:''}
    <p class="text-[11px] text-muted mt-4">KI-Einordnung aus Snapshot, 12h-Verlauf und Top-News — keine Finanzberatung.</p>`;
  lucide.createIcons(); animateCards(); attachReportButton(reportTs);
}
function attachReportButton(reportTs){
  const btn=$('#repNowBtn'); if(!btn) return;
  btn.addEventListener('click', async ()=>{
    btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="animate-spin"></i>wird angefragt …'; lucide.createIcons();
    $('#repNowStatus').textContent='Anfrage gesendet — Cloud erstellt den Bericht (ca. 1–3 min) …';
    let sent=false;
    try{ const r=await fetch(`https://ntfy.sh/${NTFY_TOPIC}`,{method:'POST',body:'market-report',mode:'cors'}); sent=r.ok; }catch{}
    if(!sent){ $('#repNowStatus').textContent='Senden fehlgeschlagen — gleich noch einmal versuchen.'; btn.disabled=false;
      btn.innerHTML='<i data-lucide="refresh-cw"></i>Neuen Marktbericht anfordern'; lucide.createIcons(); return; }
    for(let i=0;i<36;i++){ await new Promise(r=>setTimeout(r,5000));
      try{ const r2=await fetch('./data/market-report.json',{cache:'no-store'}); const rep2=await r2.json();
        if(rep2&&rep2.ts&&rep2.ts!==reportTs){ renderHome(); return; } }catch{} }
    $('#repNowStatus').textContent='Angefordert — Cloud braucht bis zu 3 min. Seite gleich neu laden.';
    btn.disabled=false; btn.innerHTML='<i data-lucide="refresh-cw"></i>Neuen Marktbericht anfordern'; lucide.createIcons();
  });
}

/* ---- Learn ---- */
async function renderLearn(){
  const el=$('#content');
  let data;
  try{ data=await (await fetch('./data/learn.json',{cache:'no-store'})).json(); }
  catch{ el.innerHTML='<div class="text-center text-muted py-16 text-[13.5px]">Lern-Inhalte gerade nicht verfügbar.</div>'; return; }
  const sections=data.sections||[];
  el.innerHTML='<p class="text-[13px] text-muted mb-4">Erklärungen zu allen Funktionen und Werten.</p>'+
    sections.map(s=>`
    <h2 class="text-[12px] text-muted uppercase tracking-widest font-mono mt-7 mb-3">${s.emoji?esc(s.emoji)+' ':''}${esc(s.title)}</h2>
    ${s.intro?`<p class="text-[13px] text-muted mb-3">${esc(s.intro)}</p>`:''}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${(s.cards||[]).map(c=>`
      <div class="border border-border bg-card rounded-2xl p-4 hover:border-border-strong transition-colors" data-anim>
        <div class="text-[14px] font-medium flex items-center gap-1.5 flex-wrap tracking-tight">${esc(c.title)}${c.tag?`<span class="text-[10px] text-accent bg-accent/10 rounded-full px-2 py-0.5 font-mono">${esc(c.tag)}</span>`:''}</div>
        <div class="text-[12.5px] text-muted leading-relaxed mt-1.5">${esc(c.body)}</div>
      </div>`).join('')}</div>`).join('');
  animateCards();
}

/* ---- Links ---- */
async function renderLinks(){
  const el=$('#content');
  const data=await (await fetch('./data/links.json',{cache:'no-store'})).json();
  const groups={};
  (data.links||[]).forEach(l=>{ (groups[l.group||'Weitere']=groups[l.group||'Weitere']||[]).push(l); });
  el.innerHTML=(data.note?`<p class="text-[13px] text-muted mb-4">${esc(data.note)}</p>`:'')+
    Object.entries(groups).map(([g,items])=>`
    <h2 class="text-[12px] text-muted uppercase tracking-widest font-mono mt-7 mb-3">${esc(g)}</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${items.map(l=>`
      <div class="border border-border bg-card rounded-2xl p-4 flex flex-col gap-2 hover:border-border-strong transition-colors" data-anim>
        <div class="text-[14.5px] font-medium tracking-tight">${l.emoji?esc(l.emoji)+' ':''}${esc(l.name)}</div>
        <div class="text-[12.5px] text-muted flex-1 leading-relaxed">${esc(l.desc||'')}</div>
        <a class="self-start inline-flex items-center gap-1 text-[12.5px] font-medium text-accent hover:underline" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">Öffnen <i data-lucide="arrow-up-right"></i></a>
      </div>`).join('')}</div>`).join('');
  animateCards(); lucide.createIcons();
}

/* ---- Live (1:1 aus v1) ---- */
const EMBEDS = [
  { id: "cg-liq", label: "Liquidations-Heatmap", url: "https://www.coinglass.com/pro/futures/LiquidationHeatMap", note: "Coinglass · Liquidations-Level je Preiszone" },
  { id: "cg-liqall", label: "Live-Liquidationen", url: "https://www.coinglass.com/liquidations", note: "Coinglass · alle Coins, laufende Liquidationen" },
  { id: "cg-funding", label: "Funding Rates", url: "https://www.coinglass.com/FundingRate", note: "Coinglass · Finanzierungsraten je Börse" },
  { id: "cg-orderbook", label: "Order Book", url: "https://www.coinglass.com/mergev2/BTC-USDT", note: "Coinglass · Order-Depth BTC/USDT (Market Depth)" },
  { id: "tv-chart", label: "BTC-Chart", url: "https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=60&theme=dark&style=1&locale=de_DE&hideideas=1&withdateranges=1", note: "TradingView · BTC/USDT 1h (offizielles Widget)" },
];
let currentEmbed = "cg-liq";
async function renderLive(){
  const el=$('#content');
  const emb=EMBEDS.find(e=>e.id===currentEmbed)||EMBEDS[0];
  const chips=EMBEDS.map(e=>`
    <button class="px-3 py-1.5 rounded-full border text-[12.5px] font-medium transition-colors ${e.id===emb.id?'bg-white/10 text-text border-border-strong':'bg-white/[0.03] text-muted border-border hover:text-text hover:border-border-strong'}" data-embed="${e.id}">${esc(e.label)}</button>`).join('');
  el.innerHTML=`
    <div class="flex items-center gap-2 flex-wrap">${chips}
      <a class="ml-auto inline-flex items-center gap-1 text-[12.5px] font-medium text-accent hover:underline" href="${esc(safeUrl(emb.url))}" target="_blank" rel="noopener noreferrer">Im Original öffnen <i data-lucide="arrow-up-right"></i></a>
    </div>
    <div class="pt-3"><iframe class="w-full rounded-2xl border border-border bg-black block" style="height:calc(100vh - 230px);min-height:480px" src="${esc(safeUrl(emb.url))}" allow="fullscreen" title="${esc(emb.label)}"></iframe></div>
    <p class="pt-2.5 text-[11px] text-muted">Externe Live-Seite: ${esc(emb.note)} · Es gelten die Datenschutz-/Cookie-Regeln des jeweiligen Anbieters.</p>`;
  el.querySelectorAll('[data-embed]').forEach(c=>c.addEventListener('click',()=>{ currentEmbed=c.dataset.embed; renderLive(); }));
  lucide.createIcons();
}

/* ---- Router + Init ---- */
async function refresh(){
  if(currentTab==='home') await renderHome();
  else if(currentTab==='links') await renderLinks();
  else if(currentTab==='live') await renderLive();
  else if(currentTab==='learn') await renderLearn();
  else await loadNews();
}
function animateCards(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!window.Motion) return;
  window.Motion.animate('[data-anim]', {opacity:[0,1],transform:['translateY(8px)','translateY(0)']},
    {duration:0.28,delay:window.Motion.stagger(0.035),easing:'ease-out'});
}
async function loadStats(){ try{ const s=await (await fetch('./data/stats.json',{cache:'no-store'})).json();
  $('#lastUpdate').textContent=s.generated_at?('akt. '+window.dateFns.format(new Date(s.generated_at.replace('Z','+00:00')),'dd.MM. HH:mm')):''; }catch{} }

document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===currentTab?'true':'false'));
refresh(); loadStats(); lucide.createIcons();
</script>
</body>
</html>
